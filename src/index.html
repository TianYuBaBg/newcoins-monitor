<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeTrade 新币列表 - CodeMint</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;font-weight:700;color:#e6edf3;margin-bottom:2px}
.sub{font-size:12px;color:#8b949e;font-weight:400}
.header-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:2px}
.coins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:4px}
.coin-card{background:linear-gradient(135deg,#1a1f2e 0%,#161b22 100%);border:1px solid #30363d;border-radius:10px;padding:16px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
.coin-card:hover{transform:translateY(-2px);border-color:#58a6ff;box-shadow:0 4px 20px rgba(88,166,255,0.1)}
.coin-card .pair{font-size:16px;font-weight:700;color:#e6edf3;margin-bottom:2px}
.coin-card .pair .base{color:#58a6ff}
.coin-card .pair .quote{color:#8b949e;font-weight:400;font-size:13px}
.coin-card .price-row{display:flex;align-items:baseline;gap:10px;margin:8px 0 10px}
.coin-card .price{font-size:24px;font-weight:700;color:#f0f6fc;font-family:'Segoe UI',monospace}
.coin-card .change{font-size:13px;font-weight:600;padding:2px 8px;border-radius:20px;display:inline-block}
.coin-card .change.up{background:#1a3a2a;color:#3fb950}
.coin-card .change.down{background:#3a1a1a;color:#f85149}
.coin-card .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;padding-top:10px;border-top:1px solid #21262d}
.coin-card .meta-item{font-size:11px;color:#8b949e;display:flex;flex-direction:column}
.coin-card .meta-item .val{font-size:13px;color:#e6edf3;font-weight:500;font-family:monospace}
.coin-card .badge-new{position:absolute;top:12px;right:12px;font-size:10px;background:#238636;color:#fff;padding:2px 8px;border-radius:10px;font-weight:600}
.coin-card .listing-date{font-size:11px;color:#e6edf3;background:#1f2a3f;border:1px solid #30363d;border-radius:4px;padding:2px 8px;margin-top:6px;display:inline-block;font-weight:500}
.last-updated{text-align:center;font-size:11px;color:#484f58;margin-top:12px}
.empty-state{text-align:center;padding:40px;color:#484f58}
.spark{width:100%;height:2px;background:linear-gradient(90deg,transparent,#58a6ff40,transparent);margin:8px 0 0;border-radius:1px}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px}
.footer{text-align:center;font-size:14px;color:#8b949e;margin-top:16px;padding-top:12px;border-top:1px solid #30363d;line-height:1.8}
.footer a{color:#58a6ff;text-decoration:none}
.footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="header-bar">
      <h2 style="font-size:18px;color:#e6edf3;">最近上线币对 <span class="sub">数据来自 SafeTrade CEX · 每5分钟自动刷新</span></h2>
      <span id="coin-count" style="font-size:12px;color:#8b949e;"></span>
    </div>
    <div class="coins-grid" id="coins-grid">
      <div class="empty-state">加载中...</div>
    </div>
    <div class="last-updated" id="update-time"></div>
  </div>
  <div class="footer">
    QQ群 928023037 · 微信 wty_01_01 · 技术咨询 | 商务合作
  </div>
</div>

<script>
function fmtNum(n) {
  if (!n || n === '—') return '—';
  var v = parseFloat(n);
  if (isNaN(v)) return n;
  if (v >= 1000000) return (v/1000000).toFixed(2) + 'M';
  if (v >= 1000) return (v/1000).toFixed(2) + 'K';
  if (v < 0.001) return v.toFixed(8);
  if (v < 1) return v.toFixed(6);
  return v.toFixed(4);
}

function isRecent(dateStr) {
  if (!dateStr) return false;
  var d = new Date(dateStr);
  if (isNaN(d)) return false;
  var now = new Date();
  var days = (now - d) / (1000*86400);
  return days <= 14;
}

function renderCoins(data) {
  var grid = document.getElementById('coins-grid');
  if (data.error || !data.coins) {
    grid.innerHTML = '<div class="empty-state" style="color:#f85149;">数据加载失败</div>';
    return;
  }
  document.getElementById('coin-count').textContent = data.coins.length + ' 个币对';
  var html = '';
  for (var i = 0; i < data.coins.length; i++) {
    var c = data.coins[i];
    var change = c.change || '—';
    var isUp = change.startsWith('+');
    var isDown = change.startsWith('-');
    var changeCls = isUp ? 'up' : isDown ? 'down' : '';
    var created = c.created_at ? c.created_at.slice(0, 10) : '—';
    var recent = isRecent(c.created_at);
    var vol = fmtNum(c.volume);
    var last = c.last || '—';
    var high = c.high || '—';
    var low = c.low || '—';
    var baseName = c.name ? c.name.replace(/\/USDT$|USDT$/,'') : '';

    html += '<div class="coin-card">' +
      (recent ? '<span class="badge-new">NEW</span>' : '') +
      '<div class="pair"><span class="base">' + baseName + '</span><span class="quote">/USDT</span></div>' +
      '<div class="listing-date">上线 ' + created + '</div>' +
      '<div class="price-row">' +
        '<span class="price">' + last + '</span>' +
        '<span class="change ' + changeCls + '">' + change + '</span>' +
      '</div>' +
      '<div class="spark"></div>' +
      '<div class="meta">' +
        '<div class="meta-item">24h成交额<div class="val">$' + vol + '</div></div>' +
        '<div class="meta-item">24h最高<div class="val">' + high + '</div></div>' +
        '<div class="meta-item">24h最低<div class="val">' + low + '</div></div>' +
      '</div>' +
    '</div>';
  }
  grid.innerHTML = html || '<div class="empty-state">暂无数据</div>';
  if (data.updated) {
    document.getElementById('update-time').textContent = '更新于 ' + data.updated;
  }
}

function loadData() {
  var grid = document.getElementById('coins-grid');
  fetch('coins.json?t=' + Date.now())
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(renderCoins)
    .catch(function() {
      grid.innerHTML = '<div class="empty-state" style="color:#f85149;">网络错误</div>';
    });
}

loadData();
setInterval(loadData, 300000);
</script>
</body>
</html>
